<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>يقين – وظائف مصانع وأمن ومحطات بنزين</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0E2A47;--turf:#12805C;--sig:#FFC81E;--bg:#EDF1F5;--red:#D93F4A;--mut:#5B6B7D;font-family:Cairo,Tahoma,sans-serif}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--ink);line-height:1.6}
button,input,select{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:0 20px;flex-wrap:wrap}
.logo{font-weight:900;font-size:26px;padding:8px 0}.logo i{font-style:normal;background:var(--sig);color:var(--ink);padding:0 10px;margin-inline-start:6px;transform:skewX(-12deg);display:inline-block}
nav{display:flex;gap:4px;overflow-x:auto}nav a{color:#b8c7d8;padding:16px 14px;font-weight:600;border-bottom:4px solid transparent;text-decoration:none;white-space:nowrap}
nav a.on{color:#fff;border-color:var(--sig)}
.hero{background:linear-gradient(115deg,var(--ink) 55%,var(--turf));color:#fff;padding:44px 20px 0}
.w{max-width:1150px;margin:auto}.hero h1{font-size:clamp(30px,6vw,58px);font-weight:900;line-height:1.15;max-width:680px}
.hero p{color:#cfdbe8;margin:12px 0 28px;max-width:560px}
.sb{display:flex;background:#fff;color:var(--ink);transform:skewX(-8deg);width:fit-content;max-width:100%;box-shadow:6px 6px 0 var(--sig);margin:0 8px -26px}
.sb div{padding:10px 24px;text-align:center;transform:skewX(8deg);border-inline-start:2px solid var(--bg)}.sb div:first-child{border:0}
.sb b{display:block;font-size:34px;font-weight:900;line-height:1.1}.sb span{font-size:13px;color:var(--mut)}
main{padding:56px 20px 60px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.bar input,.bar select{background:#fff;border:2px solid #d3dbe4;padding:9px 12px;border-radius:6px}.bar input{flex:1;min-width:180px}
.chip{background:#fff;border:2px solid #d3dbe4;border-radius:99px;padding:6px 16px;cursor:pointer;font-weight:600}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.card{background:#fff;padding:16px 18px;cursor:pointer;border-inline-start:7px solid var(--c);position:relative;transition:transform .15s}
.card:hover{transform:translateY(-3px)}.card.f{--c:var(--turf)}.card.s{--c:var(--ink)}.card.g{--c:#E8890C}
.tag{font-size:12px;font-weight:800;color:var(--c)}.card h3{font-size:18px;line-height:1.35;margin:2px 0}.pl{color:var(--mut);font-size:14px}
.pay{font-size:22px;font-weight:900;margin:8px 0}.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{background:var(--bg);font-size:12.5px;padding:2px 9px;border-radius:4px}
.warn{position:absolute;top:12px;left:12px;background:var(--red);color:#fff;font-size:12px;font-weight:800;padding:1px 8px;border-radius:4px}
.tw{overflow-x:auto;background:#fff}table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid #e3e9ef;font-size:14.5px}th{background:var(--ink);color:#fff;cursor:pointer;position:sticky;top:0;white-space:nowrap}
tr.r{cursor:pointer}tr.r:hover{background:#fff7da}.no{color:var(--red);font-weight:800}.ok{color:var(--turf);font-weight:800}
.box{background:#fff;padding:20px 22px;margin-bottom:16px;border-inline-start:7px solid var(--sig)}.box.red{border-color:var(--red)}
.box h2{font-size:22px;margin-bottom:8px}.box ul{padding-inline-start:22px}.box li{margin:3px 0}
.back{background:var(--ink);color:#fff;border:0;padding:8px 18px;font-weight:700;cursor:pointer;margin-bottom:16px;transform:skewX(-10deg)}
.dh{background:var(--c);color:#fff;padding:26px 24px}.dh.s{--c:var(--ink)}.dh.f{--c:var(--turf)}.dh.g{--c:#E8890C}
.dh h1{font-size:clamp(24px,5vw,40px);font-weight:900;line-height:1.2}.dh .pay{font-size:34px;margin:8px 0 0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:#d3dbe4;margin-bottom:16px}
.facts div{background:#fff;padding:12px 14px}.facts small{display:block;color:var(--mut);font-size:12.5px}.facts b{font-size:17px}
.fl{background:#fdecee;border:2px solid var(--red);padding:10px 14px;margin-bottom:8px;font-weight:600}
.cta{background:var(--sig);border:0;font-weight:900;font-size:18px;padding:12px 28px;cursor:pointer;transform:skewX(-10deg)}
.th{display:block;height:auto;width:calc(100% + 36px);margin:-16px -18px 12px;aspect-ratio:900/490;object-fit:contain;background:#dfe6ee}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:16px}.gal img{width:100%;display:block;background:#dfe6ee}
footer{text-align:center;color:var(--mut);padding:20px;font-size:13px}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
.note{background:#fff7da;border-inline-start:7px solid var(--sig);padding:10px 14px;margin-bottom:14px;font-size:14px}.sec{background:#fff;border:2px solid var(--ink);font-weight:800;padding:10px 20px;cursor:pointer;margin-inline-start:10px}.gal img{object-fit:contain;aspect-ratio:16/9;background:var(--bg)}
.gal figure{margin:0;display:flex;flex-direction:column;gap:6px}
.dl{display:block;text-align:center;background:var(--ink);color:#fff;border-radius:8px;padding:9px 12px;font-weight:700;text-decoration:none}
.dl:hover,.dl:focus-visible{opacity:.88}tr.r:focus-visible{outline-offset:-3px}.un{color:var(--mut);font-weight:600}#toast{position:fixed;bottom:20px;inset-inline:20px;margin:auto;max-width:420px;background:var(--ink);color:#fff;padding:12px 16px;text-align:center;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}#toast.on{opacity:1}#tr{position:fixed;inset:0;z-index:60;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .15s;cursor:pointer;text-align:center;padding:20px}#tr.on{opacity:1;pointer-events:auto}#tr .logo{font-size:44px}#tr .pb{width:min(260px,70vw);height:6px;background:rgba(255,255,255,.2);overflow:hidden}#tr .pb i{display:block;height:100%;background:var(--sig);transform-origin:right;transform:scaleX(0)}#tr.on .pb i{animation:trf 1.25s linear forwards}@keyframes trf{to{transform:scaleX(1)}}#tr small{color:#b8c7d8}@media(prefers-reduced-motion:reduce){#tr{display:none}}
.pub details{background:#fff;border:2px solid var(--ink);margin:10px 0}.pub summary{font-weight:800;padding:12px 14px;cursor:pointer}.pf{padding:6px 14px 14px}.fr{border-top:1px solid #e3e9ef;padding:10px 0;display:grid;gap:4px}.fr small{color:var(--mut);font-weight:600}.fr pre{white-space:pre-wrap;word-break:break-word;font:inherit;background:var(--bg);padding:8px 10px;border-radius:6px}.fr em{color:var(--mut);font-size:12.5px;font-style:normal}.cp{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer;justify-self:start}.cp.all{background:var(--turf);margin-top:10px;width:100%;justify-self:stretch}.pub .dl{margin-bottom:8px}
</style></head><body>

<header><div class="logo">يقين<i>وظائف</i></div><nav id="nav"></nav></header>
<div id="app"></div><footer id="ft"></footer><div id="toast" role="status"></div><div id="tr" role="status" aria-live="polite"></div>
<script src="data.js"></script><script src="app.js"></script></body></html>
